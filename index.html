<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>메모라이프</title>
  <meta name="description" content="메모, 일정, 가계부를 한 곳에서 관리하는 오프라인 라이프 관리 앱">
  <meta name="theme-color" content="#22262B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="메모라이프">

  <!-- PWA 매니페스트 -->
  <link rel="manifest" href="manifest.json">

  <!-- 아이콘 -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nanum+Gothic:wght@400;700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

  <!-- 스타일시트 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="frame" id="frame">
    <!-- 시작화면(스플래시) -->
    <div class="splash-screen" id="splashScreen">
      <svg class="splash-icon" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="splashPink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFB3C1"/>
            <stop offset="100%" stop-color="#F16C89"/>
          </linearGradient>
          <linearGradient id="splashPaper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F3EEEC"/>
          </linearGradient>
          <filter id="splashShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a2f42" flood-opacity="0.35"/>
          </filter>
        </defs>
        <ellipse cx="100" cy="182" rx="60" ry="9" fill="#7a2f42" opacity="0.18"/>
        <g filter="url(#splashShadow)">
          <rect x="24" y="20" width="152" height="152" rx="26" fill="url(#splashPaper)"/>
          <path d="M24 46 a26 26 0 0 1 26-26 h100 a26 26 0 0 1 26 26 v18 H24 Z" fill="url(#splashPink)"/>
          <circle cx="52" cy="46" r="6" fill="#fff"/>
          <circle cx="76" cy="46" r="6" fill="#fff"/>
          <circle cx="100" cy="46" r="6" fill="#fff"/>
          <circle cx="124" cy="46" r="6" fill="#fff"/>
          <circle cx="148" cy="46" r="6" fill="#fff"/>
          <line x1="44" y1="92" x2="156" y2="92" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
          <line x1="44" y1="116" x2="156" y2="116" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
          <line x1="44" y1="140" x2="124" y2="140" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
        </g>
        <ellipse cx="65" cy="35" rx="30" ry="10" fill="#ffffff" opacity="0.35" transform="rotate(-12 65 35)"/>
      </svg>
    </div>

    <!-- 상단바 -->
    <div class="topbar">
      <div>
        <img class="brand-logo" src="icons/brand-logo.png" alt="메모라이프">
        <div class="date" id="todayDate"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="icon-btn" id="searchBtn" title="검색">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="themeBtn" title="다크모드">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="shareBtn" title="공유">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13 4.5a2.5 2.5 0 1 1 .702 1.737L6.97 9.604a2.518 2.518 0 0 1 0 .792l6.733 3.367a2.5 2.5 0 1 1-.671 1.341l-6.733-3.367a2.5 2.5 0 1 1 0-3.475l6.733-3.366A2.52 2.52 0 0 1 13 4.5Z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 검색 -->
    <div class="screen" id="screen-search">
      <div class="section-label">통합 검색</div>
      <input type="text" id="searchInput" placeholder="메모, 일정, 가계부 내용 검색">
      <div class="quick-row" style="margin-top:4px;">
        <div class="pill-btn filter-chip active" data-filter="all">전체</div>
        <div class="pill-btn filter-chip" data-filter="memo">메모</div>
        <div class="pill-btn filter-chip" data-filter="sched">일정</div>
        <div class="pill-btn filter-chip" data-filter="tx">가계부</div>
      </div>
      <div class="section-label">검색 결과</div>
      <div id="searchResults"></div>
    </div>

    <!-- 홈 -->
    <div class="screen active" id="screen-home">
      <div class="today-card">
        <div style="font-size:12px;opacity:0.85;">오늘의 기록</div>
        <div class="big" id="homeGreeting">오늘도 잘 기록해봐요</div>
        <div class="today-row">
          <div class="today-chip">일정<b id="homeSchedCount">0건</b></div>
          <div class="today-chip">메모<b id="homeMemoCount">0건</b></div>
          <div class="today-chip">지출<b id="homeSpendCount">0원</b></div>
        </div>
      </div>
      <div class="section-label">빠른 기록</div>
      <div class="quick-row">
        <div class="pill-btn" data-goto="memo">+ 메모</div>
        <div class="pill-btn" data-goto="calendar">+ 일정</div>
        <div class="pill-btn" data-goto="budget">+ 지출</div>
      </div>
      <div class="section-label" id="pinnedLabel" style="display:none;">📌 고정 메모</div>
      <div class="pin-grid" id="pinnedMemos" style="display:none;margin-bottom:6px;"></div>
      <div class="section-label" id="pinnedSchedLabel" style="display:none;">📌 고정 일정</div>
      <div class="pin-grid" id="pinnedSched" style="display:none;margin-bottom:6px;"></div>
      <div class="section-label" id="pinnedTxLabel" style="display:none;">📌 고정 내역</div>
      <div class="pin-grid" id="pinnedTx" style="display:none;margin-bottom:6px;"></div>
      <div class="section-label">오늘의 타임라인</div>
      <div class="card" id="homeTimeline"></div>
      <div class="section-label">돌아보기</div>
      <div class="card" id="weekCompareCard"></div>
      <div class="card" id="lastYearCard" style="display:none;"></div>
      <div class="section-label">데이터 백업</div>
      <div class="card">
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">
          모든 메모·일정·가계부 기록을 파일로 저장하거나 불러올 수 있어요.
        </div>
        <div class="row2">
          <button type="button" class="btn" id="backupExportBtn" style="background:var(--mint-ink);">내보내기</button>
          <button type="button" class="btn" id="backupImportBtn" style="background:var(--lav-ink);">가져오기</button>
        </div>
        <input type="file" id="backupFileInput" accept="application/json" style="display:none;">
      </div>
    </div>

    <!-- 메모 -->
    <div class="screen" id="screen-memo">
      <div class="section-label">메모</div>
      <button type="button" class="add-toggle" data-toggle="memoForm" id="memoToggleBtn">+ 새 메모 추가</button>
      <div class="card form-card" id="memoForm">
        <input type="text" id="memoTitle" placeholder="제목">
        <textarea id="memoBody" placeholder="내용을 적어보세요"></textarea>
        <button type="button" class="btn" id="memoSave">저장하기</button>
      </div>
      <div class="card" id="memoList"></div>
    </div>

    <!-- 캘린더 -->
    <div class="screen" id="screen-calendar">
      <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;">
        <button type="button" class="icon-btn" id="calPrevBtn" title="이전 달">‹</button>
        <div class="section-label" id="calMonthLabel" style="margin:0;">일정</div>
        <button type="button" class="icon-btn" id="calNextBtn" title="다음 달">›</button>
      </div>
      <div class="card cal-card">
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="section-label" id="calDayLabel">선택한 날짜 일정</div>
      <button type="button" class="add-toggle" data-toggle="calForm" id="calToggleBtn">+ 일정 추가</button>
      <div class="card form-card" id="calForm">
        <input type="text" id="calTitle" placeholder="일정 제목">
        <input type="time" id="calTime">
        <select id="calRepeat">
          <option value="none">반복 안함</option>
          <option value="daily">매일 (30일)</option>
          <option value="weekly">매주 (12주)</option>
          <option value="monthly">매월 (6개월)</option>
        </select>
        <label style="font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;margin-bottom:10px;">
          <input type="checkbox" id="calNotify" style="width:auto;margin:0;">그 시간에 알림 받기
        </label>
        <button type="button" class="btn" id="calSave">저장하기</button>
      </div>
      <div class="card" id="calList"></div>
    </div>

    <!-- 가계부 -->
    <div class="screen" id="screen-budget">
      <div class="section-label">이번 달 가계부</div>
      <div class="stat-row">
        <div class="stat" id="statInBtn" data-open-type="income"><div class="lbl">수입</div><div class="val" id="statIn">0원</div></div>
        <div class="stat" id="statOutBtn" data-open-type="expense"><div class="lbl">지출</div><div class="val" id="statOut">0원</div></div>
      </div>
      <div class="card form-card" id="txForm">
        <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">
          <button type="button" class="icon-x" id="txCloseBtn">닫기</button>
        </div>
        <div class="row2">
          <select id="txType"><option value="expense">지출</option><option value="income">수입</option></select>
          <input type="number" id="txAmount" placeholder="금액">
        </div>
        <div class="row2">
          <select id="txCategory"></select>
          <input type="text" id="txMemo" placeholder="메모(선택)">
        </div>
        <button type="button" class="btn" id="txSave">저장하기</button>
      </div>
      <div class="section-label">카테고리별 지출</div>
      <div class="card" id="catBars"></div>
      <div class="section-label">전체 내역</div>
      <div class="card" id="txList"></div>
    </div>

    <!-- 하단 탭바 -->
    <div class="tabbar">
      <div class="tab active" data-tab="home">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.06l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 0 0 1.061 1.06l8.69-8.69Z"/>
            <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/>
          </svg>
        </div>홈
      </div>
      <div class="tab" data-tab="memo">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0 0 16.5 9h-1.875a1.875 1.875 0 0 1-1.875-1.875V5.25A3.75 3.75 0 0 0 9 1.5H5.625ZM7.5 15a.75.75 0 0 0 0 1.5h9a.75.75 0 0 0 0-1.5h-9Zm2.25 3.75a.75.75 0 0 1 .75-.75h6a.75.75 0 0 1 0 1.5h-6a.75.75 0 0 1-.75-.75Z"/>
            <path d="M12.971 1.816A5.23 5.23 0 0 1 14.25 5.25v1.875c0 .207.168.375.375.375H16.5a5.23 5.23 0 0 1 3.434 1.279 9.768 9.768 0 0 0-6.963-6.963Z"/>
          </svg>
        </div>메모
      </div>
      <div class="tab" data-tab="calendar">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M6.75 2.25a.75.75 0 0 1 .75.75v1.5h9V3a.75.75 0 0 1 1.5 0v1.5h.75a3 3 0 0 1 3 3v11.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3H6V3a.75.75 0 0 1 .75-.75Zm13.5 9a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5Z"/>
          </svg>
        </div>캘린더
      </div>
      <div class="tab" data-tab="budget">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2.273 5.625A4.483 4.483 0 0 1 5.25 4.5h13.5c1.141 0 2.183.425 2.977 1.125A3 3 0 0 0 18.75 3H5.25a3 3 0 0 0-2.977 2.625ZM2.273 8.625A4.483 4.483 0 0 1 5.25 7.5h13.5c1.141 0 2.183.425 2.977 1.125A3 3 0 0 0 18.75 6H5.25a3 3 0 0 0-2.977 2.625ZM5.25 9a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h13.5a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3H15a.75.75 0 0 0-.75.75 2.25 2.25 0 0 1-4.5 0A.75.75 0 0 0 9 9H5.25Z"/>
          </svg>
        </div>가계부
      </div>
    </div>

    <!-- 토스트 (실행취소 포함) -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
